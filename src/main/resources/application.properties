quarkus.http.port=8005
quarkus.http.root-path=/api
quarkus.hibernate-orm.multitenant=SCHEMA
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_URL:localhost}:5432/${DB_NAME:test}
quarkus.datasource.username=${DB_USERNAME:username}
quarkus.datasource.password=${DB_PASSWORD:password}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=tenant01,tenant02

# Default tenant configuration
quarkus.oidc.auth-server-url=http://localhost:8080/realms/master
quarkus.oidc.client-id=multi-tenant-client
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=web-app

# Tenant A configuration
#quarkus.oidc.tenant-a.auth-server-url=http://localhost:8180/realms/tenant-a
#quarkus.oidc.tenant-a.client-id=multi-tenant-client
#quarkus.oidc.tenant-a.credentials.secret=secret
#quarkus.oidc.tenant-a.application-type=web-app

# HTTP security configuration
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated